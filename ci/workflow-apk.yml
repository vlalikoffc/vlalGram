name: build-apk

# Этот файл надо перенести в .github/workflows/build-apk.yml
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Что собирать (Standalone ставится рядом с официальным Telegram)"
        type: choice
        options:
          - TMessagesProj_App
          - TMessagesProj_AppStandalone
        default: TMessagesProj_AppStandalone
      variant:
        description: "Вариант сборки"
        type: choice
        options:
          - afatRelease
          - afatStandalone
          - afatDebug
        default: afatStandalone
      abi:
        description: "Архитектура"
        type: choice
        options:
          - arm64-v8a
          - all
        default: arm64-v8a
      generate_keystore:
        description: "Сгенерировать свой ключ подписи (для раздачи)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Ключи (api_id/api_hash, свой keystore, google-services.json) берутся из
      # Settings → Secrets and variables → Actions. В репозитории их нет и быть не должно.
      # Если секреты не заведены — шаг просто ничего не меняет.
      - name: Подставить секреты
        env:
          VLAL_APP_ID: ${{ secrets.VLAL_APP_ID }}
          VLAL_APP_HASH: ${{ secrets.VLAL_APP_HASH }}
          VLAL_GOOGLE_SERVICES_B64: ${{ secrets.VLAL_GOOGLE_SERVICES_B64 }}
          VLAL_KEYSTORE_B64: ${{ secrets.VLAL_KEYSTORE_B64 }}
          VLAL_KEYSTORE_PASSWORD: ${{ secrets.VLAL_KEYSTORE_PASSWORD }}
          VLAL_KEY_ALIAS: ${{ secrets.VLAL_KEY_ALIAS }}
          VLAL_KEY_PASSWORD: ${{ secrets.VLAL_KEY_PASSWORD }}
        run: bash ci/apply-secrets.sh

      - name: Свой ключ подписи (если попросили)
        if: ${{ inputs.generate_keystore }}
        env:
          VLAL_KEYSTORE_B64: ${{ secrets.VLAL_KEYSTORE_B64 }}
          VLAL_KEYSTORE_PASSWORD: ${{ secrets.VLAL_KEYSTORE_PASSWORD }}
          VLAL_KEY_ALIAS: ${{ secrets.VLAL_KEY_ALIAS }}
        run: bash ci/make-keystore.sh

      - name: Сборка APK
        env:
          MODULE: ${{ inputs.module }}
          VARIANT: ${{ inputs.variant }}
          ABI: ${{ inputs.abi }}
        run: bash ci/build-apk.sh

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: vlalGram-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Артефакт ключа (если генерировали)
        if: ${{ inputs.generate_keystore }}
        uses: actions/upload-artifact@v4
        with:
          name: vlal-keystore
          path: out/release.keystore
          retention-days: 90

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "vlalGram $tag" \
            --notes "Сборка GitHub Actions: модуль ${{ inputs.module }}, вариант ${{ inputs.variant }}, ABI ${{ inputs.abi }}." \
            --prerelease \
            || gh release upload "$tag" out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
